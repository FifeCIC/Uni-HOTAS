<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni-HOTAS — Universal HOTAS App for Star Citizen &amp; Squadron 42</title>
    <meta name="description" content="Uni-HOTAS is a Universal HOTAS App: map, test and manage HOTAS, HOSAS, yoke and pedal bindings for Star Citizen and Squadron 42, then write them straight back to the game XML profiles." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Uni-HOTAS — Universal HOTAS App" />
    <meta property="og:description" content="Universal HOTAS Config for Star Citizen and Squadron 42 — visual binding editor, live input capture, device-aware XML write-back." />
    <meta property="og:url" content="https://fifecic.github.io/Uni-HOTAS/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b7285">
        <script>
            // GitHub Pages SPA restore: convert /?/path back to /base/path before React Router boots.
            (function (l) {
                if (!l.search || l.search.length < 2 || l.search[1] !== '/') return;
                var decoded = l.search
                    .slice(1)
                    .replace(/~and~/g, '&');
                // pathname is /Uni-HOTAS/ in prod or / in dev — strip trailing slash then append route
                var base = l.pathname.replace(/\/$/, '');
                var nextUrl = base + decoded + l.hash;
                window.history.replaceState(null, '', nextUrl);
            }(window.location));
        </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
</body>
</html>
